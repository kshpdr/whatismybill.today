services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-whatismybill}
      POSTGRES_USER:     ${POSTGRES_USER:-whatismybill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatismybill}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"  # expose for local dev (npm run dev in backend/)

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-whatismybill}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-whatismybill}
      JWT_SECRET:   ${JWT_SECRET}
      UPLOAD_DIR:   /data/bills
      PORT:         3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - bills_data:/data/bills
    ports:
      - "127.0.0.1:3001:3001"  # localhost only — Caddy proxies from outside

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"  # localhost only

volumes:
  postgres_data:   # back this up — it's your database
  bills_data:      # back this up — it's your PDFs
