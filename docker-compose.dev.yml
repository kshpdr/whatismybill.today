# Local development — starts Postgres only.
# Backend and frontend run natively (hot reload).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d   # start postgres
#   docker compose -f docker-compose.dev.yml down     # stop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       whatismybill
      POSTGRES_USER:     whatismybill
      POSTGRES_PASSWORD: localpassword
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatismybill"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
